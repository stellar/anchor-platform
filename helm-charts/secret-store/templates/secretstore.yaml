{{- define "secretstore.jsonEscape" -}}
{{- . | toJson | trimPrefix "\"" | trimSuffix "\"" -}}
{{- end -}}
{{- $sep10_jwt_secret := required "sep10_jwt_secret is required: generate it with `openssl rand -hex 32` and pass it with --set sep10_jwt_secret=<value>" (trim (toString .Values.sep10_jwt_secret)) }}
{{- $sep24_interactive_url_jwt_secret := required "sep24_interactive_url_jwt_secret is required: generate it with `openssl rand -hex 32` and pass it with --set sep24_interactive_url_jwt_secret=<value>" (trim (toString .Values.sep24_interactive_url_jwt_secret)) }}
{{- $sep24_more_info_url_jwt_secret := required "sep24_more_info_url_jwt_secret is required: generate it with `openssl rand -hex 32` and pass it with --set sep24_more_info_url_jwt_secret=<value>" (trim (toString .Values.sep24_more_info_url_jwt_secret)) }}
{{- $sep6_more_info_url_jwt_secret := required "sep6_more_info_url_jwt_secret is required: generate it with `openssl rand -hex 32` and pass it with --set sep6_more_info_url_jwt_secret=<value>" (trim (toString .Values.sep6_more_info_url_jwt_secret)) }}
{{- $sep45_jwt_secret := required "sep45_jwt_secret is required: generate it with `openssl rand -hex 32` and pass it with --set sep45_jwt_secret=<value>" (trim (toString .Values.sep45_jwt_secret)) }}
{{- $callback_api_auth_secret := required "callback_api_auth_secret is required: generate it with `openssl rand -hex 32` and pass it with --set callback_api_auth_secret=<value>" (trim (toString .Values.callback_api_auth_secret)) }}
{{- $platform_api_auth_secret := required "platform_api_auth_secret is required: generate it with `openssl rand -hex 32` and pass it with --set platform_api_auth_secret=<value>" (trim (toString .Values.platform_api_auth_secret)) }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: fake-secret-store
  namespace: {{ .Values.namespace }}
spec:
  provider:
    fake:
      data:
        - key: {{ .Values.namespace }}/anchor-platform-secrets
          # The JWT and API secrets are required chart values (see helm-charts/README.md): this repository is
          # public, so nothing committed here may be used as a secret. The reference server reuses the same
          # values because the platform and the reference server must share them.
          value: |
            {
              "POSTGRES_USER": "postgres",
              "POSTGRES_PASSWORD": "123456789",
              "SEP24_INTERACTIVE_URL_JWT_SECRET": "{{ include "secretstore.jsonEscape" $sep24_interactive_url_jwt_secret }}",
              "SEP24_MORE_INFO_URL_JWT_SECRET": "{{ include "secretstore.jsonEscape" $sep24_more_info_url_jwt_secret }}",
              "SEP6_MORE_INFO_URL_JWT_SECRET": "{{ include "secretstore.jsonEscape" $sep6_more_info_url_jwt_secret }}",
              "SEP10_JWT_SECRET": "{{ include "secretstore.jsonEscape" $sep10_jwt_secret }}",
              "SEP10_SIGNING_SEED": "{{ .Values.sep10_signing_seed }}",
              "EVENTS_QUEUE_KAFKA_USERNAME": "user1",
              "EVENTS_QUEUE_KAFKA_PASSWORD": "123456789",
              "SENTRY_AUTH_TOKEN": {{ default "\"\"" .Values.sentry_auth_token }},
              "SEP45_JWT_SECRET": "{{ include "secretstore.jsonEscape" $sep45_jwt_secret }}",
              "CALLBACK_API_AUTH_SECRET": "{{ include "secretstore.jsonEscape" $callback_api_auth_secret }}",
              "PLATFORM_API_AUTH_SECRET": "{{ include "secretstore.jsonEscape" $platform_api_auth_secret }}"
            }
        - key: {{ .Values.namespace }}/reference-server-secrets
          value: |
            {
              "POSTGRES_USER": "postgres",
              "POSTGRES_PASSWORD": "123456789",
              "PAYMENT_SIGNING_SEED": "{{ .Values.payment_signing_seed }}",
              "SEP24_INTERACTIVE_JWT_KEY": "{{ include "secretstore.jsonEscape" $sep24_interactive_url_jwt_secret }}",
              "PLATFORM_ANCHOR_SECRET": "{{ include "secretstore.jsonEscape" $callback_api_auth_secret }}",
              "ANCHOR_PLATFORM_SECRET": "{{ include "secretstore.jsonEscape" $platform_api_auth_secret }}"
            }
