name: Build Soroban Contracts

on:
  workflow_dispatch:
  workflow_call:

jobs:
  cargo_build:
    name: Cargo Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: soroban
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5
        with:
          show-progress: false
      - name: Cargo Build
        run: cargo build --verbose
      - name: Clippy
        run: cargo clippy -- -Dwarnings
      - name: Run tests
        run: cargo test --verbose
