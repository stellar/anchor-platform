name: Release Back Merge

on:
  pull_request:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  back_merge:
    name: Back Merge Main to Develop and Create Release
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "VERSION=$(grep -E '^version=' service-runner/src/main/resources/version-info.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

      - name: Create back-merge branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/merge-main-to-develop
          git push origin chore/merge-main-to-develop

      - name: Open back-merge PR to develop
        run: |
          gh pr create \
            --base develop \
            --head chore/merge-main-to-develop \
            --title "chore: back-merge main → develop (${{ steps.version.outputs.VERSION }})" \
            --body "DO NOT squash merge. No code changes expected." \
            --label release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
