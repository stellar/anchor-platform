# Weekly check that the JDK pinned in the Dockerfile is the latest GA Temurin 17 release.
# The JDK is a curl download, so Dependabot does not track it. A red run means a newer
# release exists: update TEMURIN_RELEASE in the Dockerfile.
# Schedule: Mondays 03:17 UTC. Use workflow_dispatch to run on demand.

name: JDK pin check

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jdk-pin-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Compare the Dockerfile pin with the latest Temurin 17
        run: scripts/check-jdk-pin.sh "$(sed -n 's/^ARG TEMURIN_RELEASE=//p' Dockerfile)"
