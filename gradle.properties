org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m

# HackerOne #4199186 (ANCHOR-1537): Spring Boot 3.2.4 manages Tomcat 10.1.19, which is affected by
# CVE-2025-48976 and CVE-2025-48988 (multipart heap exhaustion, fixed in 10.1.42). Spring Boot 3.2.12
# still manages 10.1.33, so the managed version is overridden here for every module.
# TomcatMultipartTest fails if this drops below 10.1.42.
# HackerOne #4243067 (ANCHOR-1591): on 10.1.19 a request Tomcat refuses caches one resource
# bundle per Accept-Language tag and the heap fills until a restart. TomcatErrorPageLocaleTest
# fails if this drops below 10.1.62, the lowest version it was run on.
tomcat.version=10.1.62
