org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m

# HackerOne #4202947 (ANCHOR-1539): Spring Boot 3.2.4 manages Spring Framework 6.1.5, whose
# ServletWebRequest parses If-None-Match with a quadratic regex (CVE-2024-38809, fixed in 6.1.12).
# Spring Boot 3.2.12 still manages 6.1.15, so the managed version is overridden here for every module.
# SpringEtagRegexTest fails if this drops below 6.1.12.
spring-framework.version=6.1.21
